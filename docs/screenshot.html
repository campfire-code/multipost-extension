<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>多平台发布插件</title><style>*{box-sizing:border-box}body{margin:0;width:1040px;height:700px;background:#f4f5f7;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#1d2129;padding:36px}
.card{background:#fff;border-radius:20px;height:628px;padding:40px 48px;box-shadow:0 2px 14px rgba(0,0,0,.06);position:relative;display:flex;flex-direction:column;overflow:hidden}
.brand{position:absolute;right:32px;top:24px;font-size:13px;color:#8a919c}
h1{margin:0 0 12px;font-size:36px;font-weight:700}
.desc{font-size:16px;line-height:1.6;color:#4e5560;margin:0 0 22px}
h2{font-size:15px;color:#ff6a1a;margin:0 0 10px;letter-spacing:1px}
ol{margin:0;padding:0;list-style:none;counter-reset:n}
li{counter-increment:n;display:flex;gap:14px;font-size:16px;line-height:1.55;margin-bottom:12px}
li:before{content:counter(n);flex:none;width:26px;height:26px;border-radius:50%;background:#fff1e8;color:#ff6a1a;font-weight:700;font-size:14px;text-align:center;line-height:26px;margin-top:1px}
.fmt{margin-top:auto;background:#f4f5f7;border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.5;color:#4e5560}.fmt b{color:#1d2129}</style><body><div class="card"><div class="brand">篝火出品</div><h1>多平台发布插件</h1><p class="desc">写一次内容，在浏览器里一键同步发布到知乎、微博、小红书、抖音等多个平台。</p><h2>怎么用</h2><ol><li><span>下载 zip 并解压到一个固定文件夹</span></li><li><span>浏览器打开扩展管理页，打开「开发者模式」</span></li><li><span>点「加载已解压的扩展程序」，选择解压后的文件夹</span></li><li><span>先在浏览器里登录目标平台，再用插件选平台发布</span></li></ol><div class="fmt"><b>交付形式　</b>Chrome / Edge 扩展包（.zip，社区版，开发者模式加载）</div></div></body></html>
